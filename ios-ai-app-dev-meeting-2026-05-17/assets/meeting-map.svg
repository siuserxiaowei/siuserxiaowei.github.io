<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" role="img" aria-labelledby="title desc">
  <title id="title">iOS AI App 开发会议地图</title>
  <desc id="desc">从创意来源到开发、测试、上架、商业化与推广的六段路径图。</desc>
  <rect width="940" height="720" fill="#fbf8ef"/>
  <g fill="none" stroke="#17211f" stroke-opacity=".18" stroke-width="1">
    <path d="M0 60h940M0 120h940M0 180h940M0 240h940M0 300h940M0 360h940M0 420h940M0 480h940M0 540h940M0 600h940M0 660h940"/>
    <path d="M60 0v720M120 0v720M180 0v720M240 0v720M300 0v720M360 0v720M420 0v720M480 0v720M540 0v720M600 0v720M660 0v720M720 0v720M780 0v720M840 0v720M900 0v720"/>
  </g>
  <text x="58" y="72" fill="#17211f" font-family="Georgia, serif" font-size="48" font-weight="700">AI as leverage, iOS as distribution</text>
  <text x="60" y="112" fill="#63706a" font-family="PingFang SC, sans-serif" font-size="18">狂热分享：把真实痛点、AI coding、App Store 和内容渠道接成一条可重复路径</text>
  <g font-family="PingFang SC, sans-serif">
    <g transform="translate(60 166)">
      <rect width="250" height="118" rx="8" fill="#0b7065" opacity=".94"/>
      <text x="22" y="38" fill="#fffdf8" font-size="22" font-weight="700">01 创意入口</text>
      <text x="22" y="70" fill="#fffdf8" font-size="15">工作痛点 · 社群吐槽</text>
      <text x="22" y="94" fill="#fffdf8" font-size="15">小红书评论 · X 产品反馈</text>
    </g>
    <g transform="translate(345 166)">
      <rect width="250" height="118" rx="8" fill="#225d84" opacity=".94"/>
      <text x="22" y="38" fill="#fffdf8" font-size="22" font-weight="700">02 AI 开发</text>
      <text x="22" y="70" fill="#fffdf8" font-size="15">多轮对话确定需求</text>
      <text x="22" y="94" fill="#fffdf8" font-size="15">生成 PRD / Swift UI / 工程文件</text>
    </g>
    <g transform="translate(630 166)">
      <rect width="250" height="118" rx="8" fill="#b94d36" opacity=".94"/>
      <text x="22" y="38" fill="#fffdf8" font-size="22" font-weight="700">03 Xcode 测试</text>
      <text x="22" y="70" fill="#fffdf8" font-size="15">模拟器 · 真机 · 日志</text>
      <text x="22" y="94" fill="#fffdf8" font-size="15">订阅场景优先真机验证</text>
    </g>
    <path d="M310 225h35M595 225h35" stroke="#17211f" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(60 345)">
      <rect width="250" height="118" rx="8" fill="#b18422" opacity=".96"/>
      <text x="22" y="38" fill="#fffdf8" font-size="22" font-weight="700">04 上架资料</text>
      <text x="22" y="70" fill="#fffdf8" font-size="15">截图 · 描述 · 隐私政策</text>
      <text x="22" y="94" fill="#fffdf8" font-size="15">关键词 · 年龄分级 · 多语言</text>
    </g>
    <g transform="translate(345 345)">
      <rect width="250" height="118" rx="8" fill="#63743c" opacity=".96"/>
      <text x="22" y="38" fill="#fffdf8" font-size="22" font-weight="700">05 商业化</text>
      <text x="22" y="70" fill="#fffdf8" font-size="15">订阅 · 买断 · 使用环节付费</text>
      <text x="22" y="94" fill="#fffdf8" font-size="15">苹果支付结算，地区差异定价</text>
    </g>
    <g transform="translate(630 345)">
      <rect width="250" height="118" rx="8" fill="#17211f" opacity=".96"/>
      <text x="22" y="38" fill="#fffdf8" font-size="22" font-weight="700">06 推广增长</text>
      <text x="22" y="70" fill="#fffdf8" font-size="15">社群 · 小红书 · X · ASO</text>
      <text x="22" y="94" fill="#fffdf8" font-size="15">Reddit 谨慎，先验证内容质量</text>
    </g>
    <path d="M310 404h35M595 404h35" stroke="#17211f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(60 555)" font-family="PingFang SC, sans-serif">
    <text x="0" y="0" fill="#17211f" font-size="22" font-weight="700">核心判断</text>
    <text x="0" y="38" fill="#34433d" font-size="17">先跑通一款 App 的完整 SOP，再用长尾组合押中少数能跑出来的产品。</text>
    <text x="0" y="70" fill="#34433d" font-size="17">别把大量时间耗在预规划上；用好模型做规划，用真实测试和渠道反馈做迭代。</text>
  </g>
</svg>

