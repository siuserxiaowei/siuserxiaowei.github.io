<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>妙记+S 会议纪要 Wiki</title>
<meta name="description" content="飞书妙记自动扫描后的会议复盘、关键判断、行动计划和观点卡。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;800;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#101210;
  --panel:#171b17;
  --panel-2:#20261f;
  --ink:#f5f0dc;
  --muted:#aaa58e;
  --line:rgba(245,240,220,.16);
  --green:#a9d46e;
  --teal:#70d0c3;
  --gold:#f2bd52;
  --red:#e66e62;
  --blue:#88b9ff;
  --paper:#efe5c5;
  --black:#0d0f0d;
  --shadow:0 24px 70px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    linear-gradient(rgba(245,240,220,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,240,220,.028) 1px, transparent 1px),
    linear-gradient(180deg,#10130f 0%,#141711 54%,#0d0f0c 100%);
  background-size:36px 36px,36px 36px,100% 100%;
  font-family:"Noto Sans SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:0;
}
a{color:inherit}
button,input,select{font:inherit}
.layout{display:grid;grid-template-columns:322px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:22px 18px;
  border-right:1px solid var(--line);
  background:rgba(12,15,12,.94);
  backdrop-filter:blur(18px);
  z-index:20;
}
.brand{display:grid;gap:10px;margin-bottom:18px}
.brand-mark{
  width:44px;height:44px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),var(--green) 54%,var(--teal));
  display:grid;place-items:center;color:#10120f;font-weight:900;
  box-shadow:0 0 0 1px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.24);
}
.brand h1{margin:0;font-size:20px;line-height:1.2;font-weight:900}
.brand p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.search{
  width:100%;height:44px;border-radius:8px;border:1px solid var(--line);
  background:#0d100d;color:var(--ink);padding:0 12px;outline:none;
}
.search:focus{border-color:rgba(169,212,110,.75);box-shadow:0 0 0 3px rgba(169,212,110,.13)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px}
.quick a,.nav a{text-decoration:none;color:var(--muted);border:1px solid transparent}
.quick a{padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.035);font-size:13px;color:var(--ink)}
.quick a:hover,.nav a:hover{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.04)}
.group{margin:18px 0}
.group-title{
  color:var(--gold);
  font:700 12px/1 "IBM Plex Mono",monospace;
  text-transform:uppercase;
  letter-spacing:0;
  margin:0 0 8px;
}
.nav{display:grid;gap:3px}
.nav a{
  display:block;padding:8px 10px;border-radius:7px;font-size:14px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav a.active{color:#11140f;background:var(--green);border-color:transparent;font-weight:800}
.nav .path{display:block;color:rgba(245,240,220,.45);font-size:11px;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.content{min-width:0}
.topbar{
  position:sticky;top:0;z-index:10;height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 28px;border-bottom:1px solid var(--line);
  background:rgba(16,18,15,.78);backdrop-filter:blur(18px);
}
.crumb{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.built{color:rgba(245,240,220,.54);font:600 12px/1 "IBM Plex Mono",monospace;white-space:nowrap}
.menu{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.04);color:var(--ink)}
.main{max-width:1220px;margin:0 auto;padding:34px 28px 80px}
.hero{
  min-height:calc(100vh - 108px);
  display:grid;align-content:center;gap:26px;
  padding:22px 0 42px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;color:#10120f;background:var(--gold);
  width:max-content;border-radius:999px;padding:8px 12px;font-weight:900;font-size:12px;
}
.hero h2{
  margin:0;
  font-family:"Noto Serif SC",serif;
  font-size:clamp(42px,7vw,90px);
  line-height:1.04;
  letter-spacing:0;
  max-width:1080px;
}
.hero-lead{max-width:850px;color:#d6d0b5;font-size:19px;line-height:1.9;margin:0}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric{
  min-height:126px;border:1px solid var(--line);border-radius:8px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  box-shadow:var(--shadow);
}
.metric strong{display:block;font:800 32px/1.05 "IBM Plex Mono",monospace;color:var(--green);margin-bottom:10px;overflow-wrap:anywhere}
.metric span{color:var(--muted);font-size:14px;line-height:1.55}
.section{margin:44px 0}
.section h3,.article h1{
  font-family:"Noto Serif SC",serif;
  font-size:34px;
  margin:0 0 18px;
  letter-spacing:0;
}
.section-intro{color:var(--muted);line-height:1.8;max-width:860px}
.insight-grid,.event-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.insight,.event-card,.action-card,.panel{
  border:1px solid var(--line);border-radius:8px;background:rgba(23,27,23,.82);
  box-shadow:var(--shadow);
  min-width:0;overflow-wrap:anywhere;
}
.insight{padding:18px}
.insight h4{margin:0 0 8px;font-size:18px}
.insight p{margin:0;color:#d2ccb0;line-height:1.75}
.visual-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.panel{padding:18px}
.panel h4{margin:0 0 14px;font-size:18px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:132px minmax(0,1fr) 38px;gap:10px;align-items:center}
.bar-label{color:#ded8bd;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--teal))}
.bar-num{text-align:right;color:var(--gold);font:700 13px/1 "IBM Plex Mono",monospace}
.tools{display:grid;grid-template-columns:minmax(0,1fr) 150px 180px;gap:10px;margin-bottom:16px}
.tools input,.tools select{
  height:42px;border-radius:8px;border:1px solid var(--line);background:#10130f;color:var(--ink);padding:0 12px;min-width:0;
}
.event-card{
  display:grid;gap:12px;text-decoration:none;padding:16px;min-height:300px;
}
.event-card:hover{border-color:rgba(169,212,110,.7);background:rgba(169,212,110,.07)}
.event-card time{font:800 13px/1 "IBM Plex Mono",monospace;color:var(--gold)}
.event-card h4{margin:0;font-size:18px;line-height:1.42}
.event-summary{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.event-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.event-counts span{border:1px solid var(--line);border-radius:7px;padding:7px 6px;color:#d8d1b8;font-size:12px;text-align:center;background:rgba(255,255,255,.035)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{border-radius:999px;padding:5px 8px;background:rgba(112,208,195,.12);color:#aee9df;font-size:12px}
.pill.gold{background:rgba(242,189,82,.14);color:#f4d28b}
.event-card p,.action-card p{margin:0;color:#d4ceb3;line-height:1.65;font-size:14px}
.action-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.action-card{padding:16px;min-height:180px}
.action-card time{font:800 12px/1 "IBM Plex Mono",monospace;color:var(--gold)}
.action-card h4{margin:10px 0 8px;font-size:17px}
.action-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.action-lane{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.035);padding:14px;min-width:0;overflow-wrap:anywhere}
.action-lane h4{margin:0 0 12px;color:var(--gold)}
.action-lane ol{margin:0;padding-left:20px;color:#d8d1b8;line-height:1.75}
.action-lane li{margin:0 0 8px}
.quote-wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quote-card{
  min-height:250px;border-radius:8px;border:1px solid rgba(242,189,82,.36);
  background:linear-gradient(145deg,rgba(242,189,82,.16),rgba(112,208,195,.07)),rgba(255,255,255,.04);
  padding:22px;display:grid;align-content:space-between;gap:18px;
  min-width:0;overflow-wrap:anywhere;
}
.quote-card blockquote{margin:0;font-family:"Noto Serif SC",serif;font-size:25px;line-height:1.32;font-weight:900;overflow-wrap:anywhere}
.quote-card .tag{color:var(--gold);font-weight:800;font-size:13px}
.quote-card p{margin:8px 0 0;color:#c9c2a7;line-height:1.55;font-size:13px}
.article{
  max-width:920px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(23,27,23,.8);
  padding:34px;
  box-shadow:var(--shadow);
  overflow-wrap:anywhere;
}
.article h1{font-size:38px}
.article h2{font-size:25px;margin:34px 0 12px;border-top:1px solid var(--line);padding-top:22px}
.article h3{font-size:20px;margin:26px 0 10px}
.article p,.article li{color:#d8d1b8;line-height:1.86;font-size:16px}
.article blockquote{margin:18px 0;padding:14px 18px;border-left:4px solid var(--green);background:rgba(169,212,110,.08);color:#eee8ce}
.article table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}
.article th,.article td{border:1px solid var(--line);padding:10px;vertical-align:top}
.article th{background:rgba(255,255,255,.06);color:var(--gold);text-align:left}
.article code{font-family:"IBM Plex Mono",monospace;background:rgba(255,255,255,.08);padding:2px 5px;border-radius:4px}
.article pre{overflow:auto;background:#0b0d0b;border:1px solid var(--line);border-radius:8px;padding:16px}
.article a{color:#bde987;text-decoration:none;border-bottom:1px solid rgba(189,233,135,.35);overflow-wrap:anywhere;word-break:break-word}
.article img{max-width:100%;height:auto;border-radius:8px}
.empty{padding:24px;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.scrim{display:none}
@media (min-width:981px) and (max-width:1380px){
  .quote-wall,.action-board,.action-lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  html,body{overflow-x:hidden}
  .layout{display:block}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-104%);transition:transform .22s ease;width:min(86vw,340px);max-width:100vw;overflow-x:hidden;contain:layout paint}
  .sidebar.open{transform:translateX(0)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:15}
  .menu{display:grid;place-items:center}
  .topbar{padding:0 14px}
  .main{padding:24px 16px 64px}
  .metric-grid,.insight-grid,.event-grid,.visual-grid,.action-board,.quote-wall{grid-template-columns:1fr}
  .action-lanes{grid-template-columns:1fr}
  .event-counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools{grid-template-columns:1fr}
  .hero{min-height:auto;padding-top:20px}
  .hero h2{font-size:clamp(38px,14vw,62px)}
  .article{padding:22px;max-width:100%;min-width:0}
  .article h1{font-size:30px}
  .article h2{font-size:22px}
  .nav a,.nav .path{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <h1>会议纪要 Wiki</h1>
      <p>妙记+S 自动扫描飞书妙记后的公开复盘站。按会议、主题、行动项和金句组织。</p>
    </div>
    <input class="search" id="search" placeholder="搜索会议、嘉宾、主题..." />
    <div class="quick">
      <a href="#home">总览</a>
      <a href="#meeting-map">会议地图</a>
      <a href="#action-dashboard">行动计划</a>
      <a href="#golden-quotes">金句墙</a>

    <div id="nav"></div>
  </aside>
  <main class="content">
    <header class="topbar">
      <button class="menu" id="mobileMenu" aria-label="打开菜单">☰</button>
      <div class="crumb" id="crumb">会议洞察总览</div>
      <div class="built" id="built"></div>
    </header>
    <div class="main" id="app"></div>
  </main>
</div>

链路混乱。\n- **37:21｜妙搭系统搭建踩坑经历与运营迭代要点**：本章节说话人作为HR分享使用妙搭系统的经验，提到三个坑：一是设计语言对齐难，用AI工具出图解决；二是权限设计复杂，建议非技术人员前台沟通；三是多维表格同步维护成本高，改用北森API接口。还指出推广要循序渐进，功能迭代注意数据库变更，避免踩坑一两周可搭建好系统。\n- **46:10｜妙搭应用搭建、关联、使用及效果介绍**：本章节说话人2解答了多个问题，包括系统搭建部署为在线方式，后端关联自有数据和API接口；介绍小客服应用搭建、权限设置、入离职角色关联等内容；提及搭建人数、数据库使用、使用人数和数据上限等情况。还表示文档有创建同款链接，培训系统飞行社有模板可参考，张佳宁鼓励大家探索应用搭建。\n- **54:12｜课程学习渠道、回放及下期活动安排**：本章节中，张佳宁为大家提供学习渠道引导，指出飞行社的超级个体空间站、AI社区和AI游乐场有很多应用模板和aily skills可供学习。本节课回放将放在文档，Linda老师文档稍后开放权限。下周有课程及AI开放麦活动，欢迎预约和分享。感谢Linda老师分享，也欢迎大家反馈后续分享需求，课程至此结束。\n\n## 行动计划\n\n- **高｜张佳宁｜AI 开放麦-飞书妙搭｜HR 自主搭建一站式福利广场待办 1**：文档权限开放：开放脱敏后截图文档的权限给参会人员，以便其查看福利管理端可使用的相关功能，如商保功能等\n- **高｜使用者｜把“视频是 AI 开放麦的第三期，KEEP HR …”转成验证动作**：视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下\n- **中｜使用者｜把“AI 开放麦活动介绍”转成验证动作**：AI 开放麦活动介绍\n- **中｜使用者｜把“活动背景：AI 开放麦是飞行社举办的 AI 飞…”转成验证动作**：活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家\n\n## 金句与观点卡\n\n> 视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下\n>\n> — 会议纪要\n\n> 活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家\n>\n> — AI\n\n> 参与方式：若有经验想分享，可点击链接投稿，会进行一对一沟通\n>\n> — 组织协作\n\n> 嘉宾信息：本期邀请了 KEEP HR 人力资源总监张玲（Linda 老师），分享 KEEP 自主搭建一站式福利广场的经验\n>\n> — 飞书生态\n\n## 原始链接与资料\n\n- [原始妙记](https://bytedance.larkoffice.com/minutes/obcnu83nl73w3jfc5bfmk9d1) `minutes`\n- [飞书纪要文档](https://vi8r050ecuz.feishu.cn/docx/IfLxdK62mogbDgxoxXLcgqdRnab) `feishu-docx`\n\n## 完整整理稿（用于核对）\n\n视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下：\n- **AI 开放麦活动介绍**\n    - **活动性质**\n        - 活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家。\n        - 参与方式：若有经验想分享，可点击链接投稿，会进行一对一沟通。\n    - **本期分享嘉宾**\n        - 嘉宾信息：本期邀请了 KEEP HR 人力资源总监张玲（Linda 老师），分享 KEEP 自主搭建一站式福利广场的经验。\n        - 分享场景：分享场景为企业福利服务平台，涉及员工福利如体检、商保理赔、心理咨询、工作居住证等复杂流程的线上化管理。\n- **福利广场项目背景**\n    - **需求产生**\n        - 原有问题：2024 年曾进行福利系统选型，市场无符合需求产品，按需求开发成本高、周期长，员工福利体验不佳，如体检方案难理解、工作居住证申请链路长等。\n        - 工具选择：发现妙搭工具，其零门槛、对非技术人员友好，可集成飞书各项应用，生态好，且在安全和权限管控方面能满足需求，因此选择妙搭和 aily 等工具搭建平台。\n    - **项目现状**\n        - 平台使用：平台已在公司内部正式使用，飞行社有脱敏的 demo 可点击链接复制同款，内部使用是基于需求从 0 到 1 搭建。\n        - 存在问题：员工找福利入口繁杂，政策迭代后不知最新版本，咨询答疑工作量大；管理员统计数据、处理重复性问题工作量大。\n- **福利广场功能介绍**\n    - **首页功能**\n        - 公告展示：展示员工福利广场的相关公告，如积分落户、商保自选等信息。\n        - 快捷入口：提供福利快捷入口，点击可进入左边导航栏相关页面，选择相应福利服务。\n        - 常用链接：包含内部 HR 系统、商保理赔和进度查询、工作居住证申请等常用链接，可一键免密登录，避免反复输入用户名和密码。\n        - 问题反馈：设有问题和建议反馈入口，可关联自己信息或匿名提交，提交后一键到管理端，管理员可进行答疑沟通。\n    - **福利项目功能**\n        - 体检服务：可进行官网一线预约、体检报告查询、电话预约，有体检方案列表。智能体检方案推荐根据员工输入信息匹配方案并排序，方便员工选择。关联阿里 agent 实现 AI 全科医生在线咨询，可上传体检报告进行智能解读，且报告只上传不存储，保护员工隐私。\n        - 商保理赔：可进入商保理赔页进行理赔申请，查看保障方案、报销须知，进行商保自选。员工登记时自动同步信息，填写家属信息后可选择方案并一键登记，管理员确认信息无误后发送扣费通知。\n        - EAP 咨询：有 AI 在线咨询、电话咨询和现场咨询，后台可配置现场咨询日期，员工预约后后台可收到通知。\n        - 工作居住证：关联北京和各地城市，有证员工显示信息，无证员工可一键申请，自动带出个人信息，只需填写申请理由和日期。系统自动计算积分排名，管理员可根据排序和指标办理。\n        - 电脑福利：用户端可查询申请资格，管理端有全部待领取人员列表、近一周到期待领取人员列表，可发通知提醒，领取后可归档记录。\n        - 其他福利：包括带薪假、积分落户、结婚生子福利、内购福利等，可一键申请或链接相关福利，管理员可自定义配置福利项目。\n    - **管理端功能**\n        - 数据查询：可查询员工信息、福利使用记录等，除加密处理的记录外，其他记录可一键导出，方便数据分析和方案设计。\n        - 配置管理：可进行公司管理、员工信息管理、福利项目配置、福利日历设置等，如设置管理员权限、同步数据、计算工作居住证积分等。\n        - 通知提醒：可发送员工提醒，如福利名额有限、商保到期等，提高福利使用热度。\n- **福利广场搭建过程及经验**\n    - **搭建流程**\n        - 需求沟通：内部沟通确定痛点和需求，与人类伙伴和数字员工（如阿里 agent、GPT 等）探讨系统框架，形成初步搭建框架文档。\n        - 设计调整：因设计语言对齐困难，通过其他 AI 工具制作设计图，截图让系统按图调整设计风格。\n        - 权限设计：权限设计开始采用角色设计无法满足需求，后在前台通过自然语言对话调整权限，避免后端权限配置混乱。\n        - 数据对接：为降低运营成本，放弃多维表格同步数据，采用与北森 API 接口对接关联报表，满足数据调用需求。\n        - 运营推广：上线时只发一篇推文介绍，根据运营需求进行小规模运营，避免高并发场景，保证系统稳定性。\n    - **注意事项**\n        - 数据库变更：功能迭代时注意数据库变更，可新建数据库，避免破坏原有数据库导致系统混乱。\n        - 系统稳定性：搭建和使用过程中要保证系统稳定性，采用 plan 模式避免影响其他页面数据库和链路。\n- **学习与应用引导**\n    - **同款应用创建**：文档中提供链接可点击创建同款应用，该版本为脱敏的用户端，管理端功能代码存在，需根据自身系统情况配置。\n    - **学习渠道**：飞行社的超级个体空间、AI 社区、AI 游乐场有很多应用模板和 aily 的 skills，可用于学习和模仿。\n    - **课程回放与预约**：本节课回放内容会放到文档中，Linda 老师的文档也会开放权限。下周还有 AI 开放麦课程，欢迎预约，也欢迎有分享意愿者积极参与。\n\n## 来源边界\n\n本页来自飞书妙记 商业务模式及个人业务经历展开交流，内容如下"}], "key_takeaways": ["音频围绕跨境电商业务模式及个人业务经历展开交流，内容如下", "跨境电商业务探讨", "自营加工卖工具：提出自营加工卖工具的业务思路，认为自营跑通后能确保工具好用，把自身踩过的坑都经历一遍后，再将经验做成工具站", "行业优势：指出跨境电商行业较为传统，存在大量自动化需求，开展此业务既能解决行业落地方案，又能用工具弥补自身，是较好的业务方向", "业务转变：有人分享之前做过视频号带货，因不好做转做代写，但代写也较难搞，目前已基本不做"], "content_score": 33, "duration": "1 小时 46 分 9 秒"}, {"id": "miaoji-20260527-04-fmk9d1", "city": "妙记+S", "date": "2026-05-27", "time": "16:55:31", "title": "2026-05-27｜AI 开放麦-飞书妙搭｜HR 自主搭建一站式福利广场", "speaker": "张佳宁", "topic": "AI 开放麦-飞书妙搭｜HR 自主搭建一站式福利广场", "source_url": "https://bytedance.larkoffice.com/minutes/obcnu83nl73w3jfc5bfmk9d1", "source_type": "feishu-minutes", "summary": "视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下", "notes_md": "视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下：\n- **AI 开放麦活动介绍**\n    - **活动性质**\n        - 活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家。\n        - 参与方式：若有经验想分享，可点击链接投稿，会进行一对一沟通。\n    - **本期分享嘉宾**\n        - 嘉宾信息：本期邀请了 KEEP HR 人力资源总监张玲（Linda 老师），分享 KEEP 自主搭建一站式福利广场的经验。\n        - 分享场景：分享场景为企业福利服务平台，涉及员工福利如体检、商保理赔、心理咨询、工作居住证等复杂流程的线上化管理。\n- **福利广场项目背景**\n    - **需求产生**\n        - 原有问题：2024 年曾进行福利系统选型，市场无符合需求产品，按需求开发成本高、周期长，员工福利体验不佳，如体检方案难理解、工作居住证申请链路长等。\n        - 工具选择：发现妙搭工具，其零门槛、对非技术人员友好，可集成飞书各项应用，生态好，且在安全和权限管控方面能满足需求，因此选择妙搭和 aily 等工具搭建平台。\n    - **项目现状**\n        - 平台使用：平台已在公司内部正式使用，飞行社有脱敏的 demo 可点击链接复制同款，内部使用是基于需求从 0 到 1 搭建。\n        - 存在问题：员工找福利入口繁杂，政策迭代后不知最新版本，咨询答疑工作量大；管理员统计数据、处理重复性问题工作量大。\n- **福利广场功能介绍**\n    - **首页功能**\n        - 公告展示：展示员工福利广场的相关公告，如积分落户、商保自选等信息。\n        - 快捷入口：提供福利快捷入口，点击可进入左边导航栏相关页面，选择相应福利服务。\n        - 常用链接：包含内部 HR 系统、商保理赔和进度查询、工作居住证申请等常用链接，可一键免密登录，避免反复输入用户名和密码。\n        - 问题反馈：设有问题和建议反馈入口，可关联自己信息或匿名提交，提交后一键到管理端，管理员可进行答疑沟通。\n    - **福利项目功能**\n        - 体检服务：可进行官网一线预约、体检报告查询、电话预约，有体检方案列表。智能体检方案推荐根据员工输入信息匹配方案并排序，方便员工选择。关联阿里 agent 实现 AI 全科医生在线咨询，可上传体检报告进行智能解读，且报告只上传不存储，保护员工隐私。\n        - 商保理赔：可进入商保理赔页进行理赔申请，查看保障方案、报销须知，进行商保自选。员工登记时自动同步信息，填写家属信息后可选择方案并一键登记，管理员确认信息无误后发送扣费通知。\n        - EAP 咨询：有 AI 在线咨询、电话咨询和现场咨询，后台可配置现场咨询日期，员工预约后后台可收到通知。\n        - 工作居住证：关联北京和各地城市，有证员工显示信息，无证员工可一键申请，自动带出个人信息，只需填写申请理由和日期。系统自动计算积分排名，管理员可根据排序和指标办理。\n        - 电脑福利：用户端可查询申请资格，管理端有全部待领取人员列表、近一周到期待领取人员列表，可发通知提醒，领取后可归档记录。\n        - 其他福利：包括带薪假、积分落户、结婚生子福利、内购福利等，可一键申请或链接相关福利，管理员可自定义配置福利项目。\n    - **管理端功能**\n        - 数据查询：可查询员工信息、福利使用记录等，除加密处理的记录外，其他记录可一键导出，方便数据分析和方案设计。\n        - 配置管理：可进行公司管理、员工信息管理、福利项目配置、福利日历设置等，如设置管理员权限、同步数据、计算工作居住证积分等。\n        - 通知提醒：可发送员工提醒，如福利名额有限、商保到期等，提高福利使用热度。\n- **福利广场搭建过程及经验**\n    - **搭建流程**\n        - 需求沟通：内部沟通确定痛点和需求，与人类伙伴和数字员工（如阿里 agent、GPT 等）探讨系统框架，形成初步搭建框架文档。\n        - 设计调整：因设计语言对齐困难，通过其他 AI 工具制作设计图，截图让系统按图调整设计风格。\n        - 权限设计：权限设计开始采用角色设计无法满足需求，后在前台通过自然语言对话调整权限，避免后端权限配置混乱。\n        - 数据对接：为降低运营成本，放弃多维表格同步数据，采用与北森 API 接口对接关联报表，满足数据调用需求。\n        - 运营推广：上线时只发一篇推文介绍，根据运营需求进行小规模运营，避免高并发场景，保证系统稳定性。\n    - **注意事项**\n        - 数据库变更：功能迭代时注意数据库变更，可新建数据库，避免破坏原有数据库导致系统混乱。\n        - 系统稳定性：搭建和使用过程中要保证系统稳定性，采用 plan 模式避免影响其他页面数据库和链路。\n- **学习与应用引导**\n    - **同款应用创建**：文档中提供链接可点击创建同款应用，该版本为脱敏的用户端，管理端功能代码存在，需根据自身系统情况配置。\n    - **学习渠道**：飞行社的超级个体空间、AI 社区、AI 游乐场有很多应用模板和 aily 的 skills，可用于学习和模仿。\n    - **课程回放与预约**：本节课回放内容会放到文档中，Linda 老师的文档也会开放权限。下周还有 AI 开放麦课程，欢迎预约，也欢迎有分享意愿者积极参与。", "chapters": [{"title": "开场", "summary": "开场", "time": "00:15"}, {"title": "KEEP 基于飞书工具搭建员工福利广场案例分享", "summary": "本章节中，来自 KEEP 的 HR 作为飞书深度用户，基于实际工作产出案例进行分享。介绍了自主搭建的员工福利广场，应用妙搭和 aily 等工具，将各类福利项目加载其中形成完整系统链路。24 年曾做福利系统选型但无果，今年福利体验问题更突出，此时发现妙搭，认为其或能解决现有痛点。", "time": "05:01"}, {"title": "选择妙搭等工具搭建平台的原因及使用情况", "summary": "本章节介绍选择妙搭等工具搭建平台的原因，一是妙搭零门槛，对非技术人员友好；二是能深度应用飞书功能，生态良好；三是在安全和权限管控方面有较高要求。该平台已在公司内部使用，飞行社上有初步搭建的脱敏 demo，可点击链接复制同款，内部使用是基于需求从 0 到 1 搭建。", "time": "07:14"}, {"title": "员工福利查找繁杂，拟集成功能至平台", "summary": "本章节指出公司早期员工查找福利项目入口众多，如商保在 keep caring 机器人、体检用云文档等，查找繁杂，且政策迭代后难辨最新版本，导致咨询答疑工作量大。管理员在统计数据、规划方案等方面也面临大量重复性工作。为解决这些问题，计划将所有功能集成到一个平台中。", "time": "08:47"}, {"title": "K蒂斯福利广场系统介绍及运行情况汇报", "summary": "本章节介绍了5月9日上线的K蒂斯福利广场。通过一分多钟视频展示其功能，如AI智能匹配体检方案、在线全科医生咨询等。展示了福利广场实际情况，包括首页公告、快捷入口、常用链接等，还介绍了体检、商保理赔、EAP咨询等功能，系统上线后运行平稳，近400用户，另有快捷查询和小客服答疑。", "time": "10:11"}, {"title": "管理端福利系统功能、优势及隐私安全设置", "summary": "本章节介绍了管理端的功能及配置。它关联管理数据，可查询员工信息，与 HR 系统对接并定时同步数据。涵盖公司管理、福利记录导出、体检方案配置等功能，还有商保、EAP 咨询等服务。能自动计算工作居住证积分，根据积分排序办理。管理仪表盘展示项目使用情况，还具备数据同步、智能客服、权限配置和隐私保护等功能。", "time": "21:14"}, {"title": "应用搭建流程分享及设计返工问题教训", "summary": "本章节主要介绍搭建流程。先内部梳理痛点与需求，和人类伙伴沟通确定需求，再与数字员工、AI 工具探讨系统框架，形成初步搭建框架并整理成类似 BRD 文档。说话人建议搭建应用时不仅整理文字，还应形成 PRD 和设计图，因自身仅用文字表述功能不明确，后续迭代设计返工，改变风格后功能链路混乱。", "time": "35:11"}, {"title": "妙搭系统搭建踩坑经历与运营迭代要点", "summary": "本章节说话人作为HR分享使用妙搭系统的经验，提到三个坑：一是设计语言对齐难，用AI工具出图解决；二是权限设计复杂，建议非技术人员前台沟通；三是多维表格同步维护成本高，改用北森API接口。还指出推广要循序渐进，功能迭代注意数据库变更，避免踩坑一两周可搭建好系统。", "time": "37:21"}, {"title": "妙搭应用搭建、关联、使用及效果介绍", "summary": "本章节说话人2解答了多个问题，包括系统搭建部署为在线方式，后端关联自有数据和API接口；介绍小客服应用搭建、权限设置、入离职角色关联等内容；提及搭建人数、数据库使用、使用人数和数据上限等情况。还表示文档有创建同款链接，培训系统飞行社有模板可参考，张佳宁鼓励大家探索应用搭建。", "time": "46:10"}, {"title": "课程学习渠道、回放及下期活动安排", "summary": "本章节中，张佳宁为大家提供学习渠道引导，指出飞行社的超级个体空间站、AI社区和AI游乐场有很多应用模板和aily skills可供学习。本节课回放将放在文档，Linda老师文档稍后开放权限。下周有课程及AI开放麦活动，欢迎预约和分享。感谢Linda老师分享，也欢迎大家反馈后续分享需求，课程至此结束。", "time": "54:12"}], "decisions": ["视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下", "AI 开放麦活动介绍", "活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家", "参与方式：若有经验想分享，可点击链接投稿，会进行一对一沟通", "嘉宾信息：本期邀请了 KEEP HR 人力资源总监张玲（Linda 老师），分享 KEEP 自主搭建一站式福利广场的经验"], "links": [{"label": "原始妙记", "url": "https://bytedance.larkoffice.com/minutes/obcnu83nl73w3jfc5bfmk9d1", "type": "minutes"}, {"label": "飞书纪要文档", "url": "https://vi8r050ecuz.feishu.cn/docx/IfLxdK62mogbDgxoxXLcgqdRnab", "type": "feishu-docx"}], "tags": ["会议纪要", "AI", "组织协作", "飞书生态"], "status": "full", "insights": [{"title": "视频是 AI 开放麦的第三期，KEEP HR 人力资源…", "detail": "视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下", "theme": "AI"}, {"title": "AI 开放麦活动介绍", "detail": "AI 开放麦活动介绍", "theme": "组织协作"}, {"title": "活动背景", "detail": "活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家", "theme": "飞书生态"}, {"title": "参与方式", "detail": "参与方式：若有经验想分享，可点击链接投稿，会进行一对一沟通", "theme": "飞书生态"}], "roles": [{"name": "张佳宁", "role": "AI 开放麦-飞书妙搭｜HR 自主搭建一站式福利广场", "advice": "视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下"}], "key_takeaways": ["视频是 AI 开放麦的第三期，KEEP HR 人力资源总监张玲（Linda 老师）分享了自主搭建一站式福利广场的经验，介绍了福利广场的功能、搭建过程及遇到的问题和解决方案，还为参会者提供了学习和应用引导，内容如下", "AI 开放麦活动介绍", "活动背景：AI 开放麦是飞行社举办的 AI 飞行家活动，汇聚了探索和分享 AI 经验、应用及技能的玩家", "参与方式：若有经验想分享，可点击链接投稿，会进行一对一沟通", "嘉宾信息：本期邀请了 KEEP HR 人力资源总监张玲（Linda 老师），分享 KEEP 自主搭建一站式福利广场的经验"], "content_score": 90, "duration": "56 分 28 秒"}, {"id": "miaoji-20260529-05-q73y7g", "city": "妙记+S", "date": "2026-05-29", "time": "03:24:38", "title": "2026-05-29｜出海业务与AI应用讨论", "speaker": "黄佳伟", "topic": "出海业务与AI应用讨论", "source_url": "https://vi8r050ecuz.feishu.cn/minutes/obcnv8ojt8de47q1x2q73y7g", "source_type": "feishu-minutes", "summary": "音频围绕代码工作的报价和外包情况展开讨论，提出了合理的报价建议和对当前外包现状的看法，内容如下", "notes_md": "音频围绕代码工作的报价和外包情况展开讨论，提出了合理的报价建议和对当前外包现状的看法，内容如下：\n- **报价相关**\n    - **报价范围**\n        - 合理报价范围：建议代码工作报价在 600 - 1000 左右，避免报价过于夸张。例如之前有人技术花费 600 元，可参考此价格区间。\n        - 维护费用：强调报价时要明确持续维护费用，不能像之前范总那样只说价格而不提维护费。\n    - **报价计算方式**：提出在所有报价时，要在时薪基础上乘以 1.5 倍，这是基于丰富的外包工作经验得出的结论。\n- **外包情况**\n    - **外包经历**：发言者和黄佳伟都有干外包的经历。\n    - **外包看法**：认为现在外包工作很多 AI 就能完成，实际工作量不大，对此表示深恶痛绝。", "chapters": [], "decisions": ["音频围绕代码工作的报价和外包情况展开讨论，提出了合理的报价建议和对当前外包现状的看法，内容如下", "合理报价范围：建议代码工作报价在 600 1000 左右，避免报价过于夸张。例如之前有人技术花费 600 元，可参考此价格区间", "维护费用：强调报价时要明确持续维护费用，不能像之前范总那样只说价格而不提维护费", "报价计算方式：提出在所有报价时，要在时薪基础上乘以 1.5 倍，这是基于丰富的外包工作经验得出的结论", "外包经历：发言者和黄佳伟都有干外包的经历"], "links": [{"label": "原始妙记", "url": "https://vi8r050ecuz.feishu.cn/minutes/obcnv8ojt8de47q1x2q73y7g", "type": "minutes"}, {"label": "飞书纪要文档", "url": "https://vi8r050ecuz.feishu.cn/docx/QoRrdZCono0OM3xvhD0c9pSEnUb", "type": "feishu-docx"}], "tags": ["会议纪要", "AI", "产品   }

function pageLink(route, label){
  return `<a href="#${route}">${label}</a>`;
}

function normalizeWikiLinks(md){
  return String(md || '').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, (_, route, label) => `[${label}](#${route})`)
    .replace(/\[\[([^\]]+)\]\]/g, (_, route) => `[${route}](#${route})`);
}

function markdown(md){
  return marked.parse(normalizeWikiLinks(md || ''));
}

function pageGroup(page){
  if (['guide','events','analysis','quotes'].includes(page.group)) return page.group;
  if (page.path.startsWith('events/')) return 'events';
  return 'guide';
}

function renderNav(filter=''){
  const q = filter.trim().toLowerCase();
  const visible = pages.filter(page => {
    if (page.route === 'home-index') return true;
    const hay = `${page.title} ${page.path} ${(page.tags||[]).join(' ')} ${page.body}`.toLowerCase();
    return !q || hay.includes(q);
  });
  nav.innerHTML = groups.map(group => {
    const items = visible.filter(page => pageGroup(page) === group.id);
    if (!items.length) return '';
    return `<section class="group"><h2 class="group-title">${group.label}</h2><div class="nav">${items.map(page =>
      `<a href="#${page.route}" data-route="${page.route}"><span>${page.title}</span><span class="path">${page.path}</span></a>`
    ).join('')}</div></section>`;
  }).join('');
  markActive();
}

function markActive(){
  const route = location.hash.replace(/^#/, '') || 'home';
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
}

function barChart(counter){
  const entries = Object.entries(counter).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(([,v])=>v), 1);
  return `<div class="bars">${entries.map(([label,value])=>`
    <div class="bar-row"><div class="bar-label" title="${label}">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8, value/max*100)}%"></div></div><div class="bar-num">${value}</div></div>
  `).join('')}</div>`;
}

function eventCard(event){

  const counts = {
    章节: (event.chapters || []).length,
    角色: (event.roles || []).length,
    行动: (actionsByEvent[event.id] || []).length,
    观点: (quotesByEvent[event.id] || []).length
  };
  return `<a class="event-card" href="#${event.id}">
    <div>
      <time>${event.date || '未标日期'} · ${event.city}</time>
      <h4>${event.title}</h4>
      <div class="meta"><span class="pill gold">${event.status}</span>${tags}</div>

    <p><strong>嘉宾：</strong>${event.speaker || '未标注'}</p>

    <div class="event-counts">${Object.entries(counts).map(([label,value])=>`<span>${value}<br>${label}</span>`).join('')}</div>
  </a>`;
}

    const items = events.filter(event => {
      const hay = `${event.title} ${event.speaker} ${event.topic} ${event.summary} ${(event.tags||[]).join(' ')} ${(event.key_takeaways||[]).join(' ')} ${(event.roles||[]).map(role=>`${role.name} ${role.role} ${role.advice}`).join(' ')}`.toLowerCase();

        <ol>${items.map(item => `<li><a href="#${item.event_id}">${item.title}</a>：${item.detail}</li>`).join('')}</ol>
      </div>
    `).join('')}</div>
  </section>
  <section class="section">
    <h3>按主题推进</h3>
    <div class="insight-grid">${themeBlocks.map(([theme,items])=>`
      <article class="insight"><h4>${theme} · ${items.length} 条</h4><p>${items.slice(0,4).map(item=>`${item.title}：${item.detail}`).join('；')}</p></article>
    `).join('')}</div>
  </section>
  <section class="section">
    <h3>全部行动项</h3>
    <div class="action-board">${actions.map(action => `
      <article class="action-card">
        <time>${action.priority || '中'} · ${action.city || ''} · ${action.theme || ''}</time>
        <h4>${action.title || action.owner || '行动项'}</h4>
        <p><strong>${action.owner || '相关成员'}</strong><br>${action.detail || ''}</p>
        <p><a href="#${action.event_id}">回到来源会议</a></p>
      </article>
    `).join('')}</div>
  </section>`;
}

function renderQuoteWall(){
  return `<section class="section">
    <h3>金句墙</h3>
    <p class="section-intro">短句适合截图传播；每张卡片都保留主题和来源事件入口。</p>
    <div class="quote-wall">${quotes.map(quoteCard).join('')}</div>
  </section>`;
}

async function renderPage(route){
  const page = byRoute[route];
  if (!page) {
    if (route === 'home') return renderHome();
    app.innerHTML = '<div class="empty">页面不存在。</div>';
    crumb.textContent = 'Not found';
    return;
  }
  crumb.textContent = page.title;
  let extra = '';
  if (route === 'meeting-map') extra = renderMeetingMap();
  if (route === 'action-dashboard') extra = renderActionDashboard();
  if (route === 'golden-quotes') extra = renderQuoteWall();
  app.innerHTML = `<article class="article">${markdown(page.body)}</article>${extra}`;
  wireMeetingMap();
  await renderMermaid();
}

async function renderMermaid(){
  const blocks = [...document.querySelectorAll('code.language-mermaid')];
  for (let i = 0; i < blocks.length; i++) {
    const code = blocks[i];
    const holder = document.createElement('div');
    holder.className = 'mermaid';
    holder.textContent = code.textContent;
    code.closest('pre').replaceWith(holder);
  }
  if (document.querySelector('.mermaid')) await mermaid.run({querySelector:'.mermaid'});
}

function navigate(){
  closeMenu();
  const route = location.hash.replace(/^#/, '') || 'home';
  markActive();
  if (route === 'home') renderHome();
  else renderPage(route);
}

function openMenu(){ sidebar.classList.add('open'); scrim.classList.add('open'); }
function closeMenu(){ sidebar.classList.remove('open'); scrim.classList.remove('open'); }

search.addEventListener('input', () => renderNav(search.value));
mobileMenu.addEventListener('click', openMenu);
scrim.addEventListener('click', closeMenu);
window.addEventListener('hashchange', navigate);
renderNav();
navigate();
</script>
</body>
</html>
