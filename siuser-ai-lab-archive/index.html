下文和内置浏览器高级注释的功能太有用了。你只需要同时按住左边和右边的 Command 键，它就会把你当前鼠标所在位置的窗口全部截下来，然后自动填入到 Codex 的输入框里。它这个截图不只是你当前窗口的这个位置，而且它会把屏幕上没有的文本，也都填入到上下文里。然后 /goal 这个功能已经正式上线到 Codex App 了。这个功能更猛，你只要给它一个目标，它就会一直执行直到完成任务。这个过程可能持续几小时甚至几天时间。而且你还可以：随时更改它的目标和引导、随时暂停，等你需要的时候继续执行。如果你按下这个斜杠命令以后，没有出现这个可选项的话，你需要去它的 config 文件里改一下这个指令，它就能开启。具体方式是：在 `config.toml` 中启用 `features.goals`  `goals = true`应用内浏览器也变得非常快和流畅。它有一个高级注释模式，可以让你在评论元素的同时去修改这些元素，甚至可以直接编辑。这个可太爽了！你比如说用了我的 PPT Skills 以后，你觉得这个字太小或者里边的文字不对，你就可以直接编辑这个文字，而不用让 Codex 去帮你编辑。还有一个是团队共享插件。在团队版本中，现在可以给你的团队成员批量安装插件了，目前该功能支持 Business 用户使用。详情：x.com/OpenAI/status/2057617844800794878", "links": [{"url": "https://mp.weixin.qq.com/s?t=pages%2Fimage_detail\u0026scene=1\u0026__biz=MzU0MDk3NTUxMA%3D%3D\u0026mid=2247496891\u0026idx=1\u0026sn=89abe0c7d5cd06ae07de8efbf0c879ba\u0026from_masonry=1\u0026sharer_shareinfo_first=a21b7ba336ded66c1b518d98c914d20b\u0026sharer_shareinfo=cd31d803520168eb75260ac8488ca650#wechat_redirect", "status": "unavailable"}]}, {"pos": 31, "create_time": 1779434593, "kind": "text", "sender": "siuser小伟", "body": "小红书能上传skill 了", "detail": "", "links": []}, {"pos": 32, "create_time": 1779434593, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "thumbnail", "src": "assets/0afe45c9c17038d8b825b5c7.webp", "width": 102, "height": 210, "ocr": "", "alt": "群聊图片，没有识别出可读文字", "ocr_checked": true}, "links": []}, {"pos": 33, "create_time": 1779434608, "kind": "text", "sender": "siuser小伟", "body": "但只能复制口令", "detail": "", "links": []}, {"pos": 35, "create_time": 1779434609, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "thumbnail", "src": "assets/d7afe760dd815fdfd30b2260.webp", "width": 163, "height": 210, "ocr": "歸藏的 PPT Skill\n复制口令給 AI一销安裝\n清武计活安箱，智制四像发性你的具", "alt": "群聊图片，图片文字开头：歸藏的 PPT Skill复制口令給 AI一销安裝清武计活安箱，智制四像发性你的具"}, "links": []}, {"pos": 36, "create_time": 1779435435, "kind": "text", "sender": "siuser小伟", "body": "有点意思，这是一个好选题#万物皆是 tle": "GitHub - hugohe3/ppt-master: AI turns documents or topics into real, native PowerPoint decks—with native shapes, transitions and animations, data-backed charts and tables on demand"}]}, {"pos": 58, "create_time": 1779553320, "kind": "text", "sender": "siuser小伟", "body": "为「[主题]」设计一张高级概念海报。画面核心不是直接描绘主题本身，而是把主题转化为一个有生命感的“内在系统图谱”。使用一个大型有机圆形结构作为主视觉，形态类似树木年轮、水波扩散、指纹纹理、地形等高线、能量漩涡或生命切片；中心有一个清晰的核心点，向外扩散出多层不规则环形纹理，表现主题的成长、积累、演化、扩张与内在秩序。\n\n在圆形系统中设置若干黑色小节点与极细引导线，将「[关键词1]、[关键词2]、[关键词3]、[关键词4]、[关键词5]」作为系统中的精神坐标，而不是普通文字列表。文字标注应像科学图谱、星图、解剖图或研究手稿一样自然分布，形成理性标注与感性纹理之间的反差。\n\n整体风格为极简高级海报、艺术学院毕业展、概念视觉设计、信息图谱、自然纹理实验、抽象品牌视觉。背景使用大量干净留白，带轻微纸张质感，不使用复杂场景。主视觉占据画面上方或中心偏上位置，下方保留安静空间用于标题、短文案或品牌信息。可加入一个微缩版本的小圆形系统作为“局部放大 / 灵魂切片 / 第二视角”，增强宏观与微观的对照。\n\n色彩以「[主色]」为大面积有机底色，叠加少量「[辅色]」作为纹理脉络，用黑色作为文字、节点和细线锚点。色彩应透明、晕染、颗粒化、带手工水彩或版画质感，边缘自然破碎、呼吸感强。整体避免商业模板感，避免过度装饰，避免机械几何，追求感性、理性、生命力和精神性的平衡。\n\n——————\n本次主题：心理学知识点讲解\n\n比如：破窗效应\n一共9个这种效应\n\n每个画面，在主色 / 排版 / 字体气质 上都多元变化\n每个画面关键词 你自己智能安排\n\n文字能 多维度， 多样式属性的，介绍好这个知识点，让人有所收获，被收获满满。\n\n比例16:9", "detail": "", "links": []}, {"pos": 59, "create_time": 1779553320, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "thumbnail", "src": "assets/7e346ae683e986b93ffc11f4.webp", "width": 210, "height": 156, "ocr": "", "alt": "群聊图片，没有识别出可读文字", "ocr_checked": true}, "links": []}, {"pos": 62, "create_time": 1785245559, "kind": "link", "sender": "siuser小伟", "body": "目前最强的编程 Agent，不是 Fable 5，而是「用Codex指挥ChatGPT Pro」", "detail": "Codex 当产品经理和 QA，ChatGPT Pro 当高级程序员：一套真正闭环的双 Agent 编程工作流", "links": [{"url": "https://mp.weixin.qq.com/s?__biz=MzI1MTUxNzgxMA%3D%3D\u0026mid=2247502708\u0026idx=1\u0026sn=0bbe673bf2176044977d41dfb510d7e3\u0026chksm=e846e5861a1aff176c1d6ca59ea5be7e18ce111eb71b78da5faca9703ba00cc5a71059e59b19\u0026mpshare=1\u0026scene=1\u0026srcid=0728n9RBGV3uZyF9KaJ7qZVY\u0026sharer_shareinfo=4aa8452a9e945509d0c99c4cf0c911a8\u0026sharer_shareinfo_first=4aa8452a9e945509d0c99c4cf0c911a8#rd", "status": "unavailable"}]}, n打开 ~/.codex/config.toml，并在顶级位置（在任何 [section] 标题之前）添加或更新这些设置：\n\n```\nmodel = \"gpt-5.6-sol\"\nmodel_context_window = 1000000\nmodel_auto_compact_token_limit = 900000\n```\n\n第一个设置选择模型。第二个设置告诉 Codex 使用一百万令牌的上下文预算。第三个设置在大约 900,000 令牌时启动自动历史压缩，为其留出一些余量。保存后，重启 Codex 客户端并启动新会话。\n\n若要为单个 CLI 会话试用配置，而不更改默认值：\n\n```\ncodex -m gpt-5.6-sol \\\n  -c model_context_window=1000000 \\\n  -c model_auto_compact_token_limit=900000\n```", "detail": "", "links": []}, {"pos": 222, "create_time": 1786970206, "kind": "link", "sender": "siuser小伟", "body": "从0到1做微信生态垂直小店：全域垂直内容+IP带货全攻略（万字实操版） - 飞书云文档", "detail": "https://my.feishu.cn/wiki/DC42wIhg5iRKi4koe6tc64Uhnuc", "links": [{"url": "https://my.feishu.cn/wiki/DC42wIhg5iRKi4koe6tc64Uhnuc", "status": "unavailable"}]}, {"pos": 223, "create_time": 1786974121, "kind": "text", "sender": "siuser小伟", "body": "发个招聘 🙋@所有人\n\n我们在招一个 AI 产品运营（开发者体验方向），全职兼职都行，可远程。\n\nJD 原文放下面👇 看完有兴趣欢迎发到 【邮箱：[邮箱已隐藏]】\n\nAI 产品运营（开发者体验方向）\n\n全职 / 兼职均可 · 远程，不限城市\n\n我们在做一个面向全球开发者的收款平台（Merchant of Record），帮独立开发者和出海团队解决\"钱怎么收回来\"这件事。\n\n想找的人其实很好描述：你本来就是我们的用户。 自己做过产品、自己上过线，被支付、汇率、风控、拒付这些事折腾过。所以商家一开口，你就知道他卡在哪。\n\n◆ 你会做什么\n\n管开发者从看到我们、接进来、到长期用下去的整条路：文档、SDK 和插件、技术支持、社群，还有支撑这些的内部工具。\n一线的问题你先接：接入报错、KYB 卡审、提现没到、拒付争议。判断是产品的毛病还是用法的问题，能自己动手改的就直接改。\n盯住线上：支付成功率、Webhook 投递、结算和打款。出事你排查、你推动、你对外说清楚。\n拿到的反馈别烂在工单里，变成文档、变成需求、变成下个版本。\n\n这里没有\"提需求 → 排期 → 等开发\"，发现问题的人就是解决问题的人。\n\n◆ 你大概是这样\n\n✓ 会写代码，而且现在还在写。不卡年限学历，我们看你做过什么。\n✓ 有从 0 到 1 上线过的东西，可以附上你做过的项目链接，那就是你的简历。\n✓ AI 原生的干活方式。Claude Code、Cursor 这类工具在真实项目里用透了，想听一个具体案例，不是工具清单。\n✓ 能写、能查、能上线。TypeScript / Python 熟一个，看得懂日志、写得出 SQL、自己能部署。\n✓ 愿意 hands on。你得真的在意开发者的体验，帮开发者处理问题。\n\n◆ 加分\n\n自己的产品收到过海外的钱，Stripe / Paddle / Lemon Squeezy / Creem 用过、也踩过坑，这条最值钱。懂点收单、3DS、拒付、KYB 更好。有开源维护、社群运营，或写过被转的技术内容也算。\n\n◆ 我们这边\n\n· AI 工具公司全包，Claude Code、Codex 订阅费我们出，超出额度可以申请调整（公司的预算不能用于个人项目）\n· 团队精简、周期短，1–2 周一个迭代，直接对结果负责\n· 技术分享常有，自下而上提的优化和新想法能拿到资源立项\n· 你的 side project 继续做，不冲突就行，我们本来就想找这样的人\n\n薪资面议，做得好给股权。\n\n◆ 投递\n\n📮 [邮箱已隐藏]", "detail": "", "links": []}, {"pos": 224, "create_time": 1786974125, "kind": "text", "sender": "siuser小伟", "body": "朋友他们公司在招聘，支付的这种岗位还是比较有前景的\n\n然后也能看到收付款的全流程，还可以看到是哪些站在赚钱，感兴趣的朋友可以投递一波", "detail": "", "links": []}, {"pos": 226, "create_time": 1786975281, "kind": "sticker", "sender": "siuser小伟", "body": "消息内容", "detail": "", "links": []}, {"pos": 227, "create_time": 1786978819, "kind": "text", "sender": "siuser小伟", "body": "新活动", "detail": "", "links": []}, {"pos": 228, "create_time": 1786978819, "kind": "link", "sender": "siuser小伟", "body": "小红书vibecoding大赛启动", "detail": "@科技薯 的笔记\n14人分享", "links": [{"url": "https://www.xiaohongshu.com/discovery/item/6a83207d000000002702267a?app_platform=ios\u0026app_version=9.42\u0026share_from_user_hidden=true\u0026xsec_source=app_share\u0026type=normal\u0026xsec_token=CBX_Jm5z5b3f7aVYWLHJQoEuxuk7vqZ_Xh7iPLYlUi9RA%3D\u0026author_share=1\u0026xhsshare=WeixinSession\u0026shareRedId=N0g1NUlKSE86TEZFSko2Rz1JT0xHOzo-\u0026apptime=1786978796\u0026share_id=8af6963240904b2db226dae62942e6fe\u0026code=2Z0fYvOnH7u", "status": "read", "title": "小红书vibecoding大赛启动！ - 小红书"}]}, {"pos": 229, "create_time": 1786981003, "kind": "text", "sender": "siuser小伟", "body": "https://xcnkl208r114.feishu.cn/docx/I7ItdrvjuoNtrMxEg16cQdFgn6e", "detail": "", "links": [{"url": "https://xcnkl208r114.feishu.cn/docx/I7ItdrvjuoNtrMxEg16cQdFgn6e", "status": "unavailable"}]}, {"pos": 230, "create_time": 1786981003, "kind": "text", "sender": "siuser小伟", "body": "00后还是太会玩了[捂脸] \n\n把公域全部洗到私域", "detail": "", "links": []}, {"pos": 231, "create_time": 1786981004, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "thumbnail", "src": "assets/7377d0043245381a00a929a8.webp", "width": 180, "height": 174, "ocr": "顺中a实，睡售事学S亿A仰，製重dA", "alt": "群聊图片，图片文字开头：顺中a实，睡售事学S亿A仰，製重dA"}, "links": []}, {"pos": 232, "create_time": 1786981290, "kind": "file", "sender": "siuser小伟", "body": "product-hunt-daily-2026-08-16-cn.pdf", "detail": "", "links": []}, {"pos": 233, "create_time": 1786981290, "kind": "text", "sender": "siuser小伟", "body": "【2026.8.16 Product Hunt Top 7】\n1、🥇 HarnessRouter Community Edition — 开源统一Agent运行时接口，一套协议兼容多种Agent Harness\n2、Blume — AI原生、Markdown优先的文档框架\n3、Expeditione — 交互式3D百科全书\n4、Vidaya — 用可穿戴设备+化验+基因数据算出你的健康寿命分\n5、Chert — 几行代码接入AI视频通话Agent（FaceTime版Vapi）\n6、AirAlarm — 在睡眠周期结束时智能唤醒\n7、CostLogic — AI驱动的建筑工程量计算与报价开票\n\n🔍 趋势总结\n- Agent互联互通成为新基建：榜首 HarnessRouter 和第5名 Chert 都在解决”让AI Agent更容易被集成/调用”这个问题，说明开发者侧的关注点正从”造Agent”转向”接Agent”。\n-文档/知识工程被AI重构：Blume 把文档框架做成”AI原生”标准，呼应了Agent时代对结构化上下文的刚需。\n- 消费端AI继续往”硬指标”走：Vidaya、AirAlarm 都在用可量化数据（健康寿命分、睡眠周期）替代模糊的”健康建议”，用户对可验证结果的需求在上升。", "detail": "", "links": []}, {"pos": 234, "create_time": 1786987044, "kind": "channel_video", "sender": "siuser小伟", "body": "烧了💰1000，我做了一个商业广告专家，Seedance2.5直出TVC！\n#seedance\n", "detail": "", "media": {"kind": "channel_video", "quality": "cover", "src": "assets/579b7d680dad41d9428c5ac7.webp", "width": 720, "height": 540, "ocr": "烧1000元做skil\n一键量产TVC", "alt": "视频封面，图片文字开头：烧1000元做skil一键量产TVC"}, "links": [], "video_author": "栗噔噔", "video_url": "https://finder.video.qq.com/251/20302/stodownload?encfilekey=rgjNqbibdAo2pd3h8UaqpH0JbAe6Kp9JoFsEglwtlDfOb4Hhic9O89vh3Dg4W0qVibEziatE1sCpoQYmSFTItia0KaQ\u0026bizid=1023\u0026dotrans=0\u0026hy=SH\u0026idx=1\u0026m=\u0026uzid=7a170", "video_note": "视频号原始媒体链接，可能已过期或无法在浏览器播放。"}, {"pos": 235, "create_time": 1786987045, "kind": "text", "sender": "siuser小伟", "body": "https://github.com/nutllwhy/seedance-tvc-director", "detail": "", "links": [{"url": "https://github.com/nutllwhy/seedance-tvc-director", "status": "read", "title": "GitHub - nutllwhy/seedance-tvc-director: A Seedance 2.5 TVC director Skill for 15s, 30s and custom commercial video prompts, storyboards, voiceover routing and evidence-driven reta"}]}, {"pos": 236, "create_time": 1786990502, "kind": "text", "sender": "siuser小伟", "body": "说个骚招！\n\n如果你要批量发送邮箱\n\n但是你的内容又是违规的，例如NSFW\n\n可以放到word或者md等其他格式\n\n让AI发送文件里面的内容\n\n亲测巨好用", "detail": "", "links": []}, {"pos": 237, "c 问下服务端渲染做页面是谷歌爬虫爬取页面的硬标准么？如果是某个类型的包含多个小游戏的游戏站的话，也强制要求要服务端渲染么？"}, {"index": 1, "sender": "哥飞", "time": "2026-08-18 20:35", "type": "1", "text": "我觉得你的问题表述方式错了，你应该问，对于多个小游戏的网站，如何做服务端渲染。"}, {"index": 2, "sender": "哥飞", "time": "2026-08-18 20:36", "type": "1", "text": "你会问出这个问题，要么你是一个前端开发，要么你前后端编程都不懂。"}, {"index": 3, "sender": "哥飞", "time": "2026-08-18 20:37", "type": "1", "text": "任何一个想要从搜索引擎拿排名的页面都需要服务端渲染。"}, {"index": 4, "sender": "哥飞", "time": "2026-08-18 20:37", "type": "1", "text": "在这个前提下，你的问题是，如果有 10 个游戏，你的代码要怎么写？"}, {"index": 5, "sender": "哥飞", "time": "2026-08-18 20:38", "type": "1", "text": "我们先从最简单的方法说起，你可以为每一个游戏做一个 html 文件，同时再做一个首页，在首页里列出 10 个游戏 html 文件的访问网址，于是你就做出来了一个游戏站。"}, {"index": 6, "sender": "哥飞", "time": "2026-08-18 20:39", "type": "1", "text": "10 个游戏还好，如果是 100 个游戏，1000 个游戏，难道我们也去生成 100个，1000 个html 文件吗？\n那显然管理起来很麻烦。\n想一想，如果你需要修改页面某个位置的样式，就需要每一个html 文件都去修改一遍，那显然麻烦急了。"}, {"index": 7, "sender": "。", "time": "2026-08-18 20:40", "type": "1", "text": "是的。那有什么更好的方案么。"}, {"index": 8, "sender": "。", "time": "2026-08-18 20:40", "type": "1", "text": "因为我的策略是先上少量游戏，后续慢慢加数量。"}, {"index": 9, "sender": "哥飞", "time": "2026-08-18 20:47", "type": "1", "text": "而其实，不管是 10 个还是 100 个游戏，其实这些游戏页面，都有一些共性。\n\n都有游戏名称、一句话介绍、分类、iframe url、详细图文介绍等等信息。\n\n如果把 100 个 html 文件的以上信息都抽离出去，你会发现剩下的 html 代码，其实就是页面框架，很相似很相似。\n\n这个页面框架，就是一个页面模板，你可以想象成一篇文章，到处是空格，你用 A 游戏的数据把这些空格填好，整个页面就是 A 游戏页面，用 B 数据填好就是 B 游戏页面。"}, {"index": 10, "sender": "。", "time": "2026-08-18 20:49", "type": "1", "text": "额。。我这边的游戏站初始内容是原创的内容，没有用iframe url，用的astro这个技术栈来实现的原创游戏。因为我想等网站有流量了再接入游戏平台的游戏。所以我的卡点在这里，如果不用astro这种技术栈，还有别的办法可以实现服务端渲染页面么。"}, {"index": 11, "sender": "哥飞", "time": "2026-08-18 20:50", "type": "1", "text": "你别打岔，等我讲完"}, {"index": 12, "sender": "。", "time": "2026-08-18 20:50", "type": "1", "text": "👌"}, {"index": 13, "sender": "哥飞", "time": "2026-08-18 20:51", "type": "1", "text": "假设页面模板上有20 个空格等待填写。\n\n那你要添加 10 个游戏，无非准备 10 套包含 20 个信息的数据。\n要添加 100 个游戏，也就是准备 100 套数据。\n\n这里的每套数据都只跟游戏自己有关，跟网页样式无关。\n拿出任何一套数据填进空格，就组装出来了一个新的游戏页面。"}, {"index": 14, "sender": "哥飞", "time": "2026-08-18 20:55", "type": "1", "text": "当用户想要打开某个游戏页面时，你可以返回 html 模板，然后在前端 js 触发，像后端获取当前游戏的数据，再用 js 一个一个空格填进去，渲染出来一个游戏网页，这就是前端渲染。\n\n从上面的过程可以看到，前端渲染分两步，第一步返回空壳的 html 模板，第二步 js 获取信息后填入空格，就不再是空壳了，而是有信息的页面了。\n\n但是搜索引擎爬虫大多数时候，只会抓取第一步，于是不管打开你哪个游戏页面，得到的都是同一套空壳html 模板，没有任何信息，那爬虫就不知道你这些页面到底是关于什么的了。\n\n而对于我们这些小网站来说，爬虫也懒得去执行js，于是这些空壳页面就会被舍弃，爬虫直接不要了。"}, {"index": 15, "sender": "哥飞", "time": "2026-08-18 20:59", "type": "1", "text": "而后端渲染，其实就是在后端把两个步骤做完，当前用户请求的网址是关于游戏 A 的，我们后端程序从数据库里（或者别的地方，如文本文件也行）获取到 A 游戏的数据，程序执行把 html 模板上面的空格填好之后，再返回给前端，让浏览器去显示页面。\n后端做的事情，就是动态渲染，也叫做后端渲染。\n\n这时候，不管是用户的浏览器访问，还是爬虫访问，只需要访问一次，就能够得到带了完整游戏信息的 html 代码。\n搜索引擎爬虫就可以解析 html 得到游戏信息，从而可以得到网页主题，才有可能进入用户搜索结果里。\n\n具体可见\"谷歌搜索模拟器\"\nhttps://new.web.cafe/search-simulator/"}, {"index": 16, "sender": "哥飞", "time": "2026-08-18 21:06", "type": "1", "text": "以上这些每一个游戏的数据，如果可以在网站后台给管理起来，那就会更方便。\n网站的编辑人员，可以添加游戏，查看游戏列表，搜索游戏，从游戏列表里选择某个游戏编辑游戏信息，隐藏或者删除某个游戏。\n也就是说，编辑不需要懂技术，就可以管好游戏站。\n\n那么游戏开发人员，怎么和网站合作呢？\n通常的方式是，职责分离，游戏开发人员把游戏部署起来，给出一个可供 iframe 的 url 给编辑。\n编辑拿到后，填到网站后台，再填写好其他信息，就能够快速上架一个游戏。\n\n编辑不需要接触游戏代码，不需要懂游戏代码。\n游戏开发后续需要更新游戏，只需要修改游戏代码，重新部署就行，只要保证每一次部署后的网址都是同一个，那么编辑就不需要做任何处理。"}, {"index": 17, "sender": "哥飞", "time": "2026-08-18 21:08", "type": "1", "text": "而且，这样做还有一个好处，编辑去修改给 SEO 准备的游戏文案，不需要去修改游戏代码。\n\n搜索引擎爬虫抓取到的游戏页面，也都是关于SEO 相关的信息，而不会有任何游戏逻辑代码。\n\n游戏代码不会影响 SEO。"}, {"index": 18, "sender": "哥飞", "time": "2026-08-18 21:09", "type": "1", "text": "对于你们来说，也是一样的。\n\n不管是你们自己开发的游戏，还是别人开发的游戏，在你的游戏网站发布时，都只需要填写一个游戏 iframe url 就可以了。"}, {"index": 19, "sender": "哥飞", "time": "2026-08-18 21:09", "type": "1", "text": "@。 还有疑问吗"}, {"index": 20, "sender": "。", "time": "2026-08-18 21:11", "type": "1", "text": "我大概能明白了，所以假如我要做这样的一个站。正确思路应该是找一个审核难度比较低的游戏平台先开发要上的游戏，然后网站内使用 iframe url  + 服务端渲染即可。游戏和网站的内容是分开管理的。 @哥飞"}, {"index": 21, "sender": "源", "time": "2026-08-18 21:12", "type": "1", "text": "你可以自己部署呀"}, {"index": 22, "sender": "哥飞", "time": "2026-08-18 21:12", "type": "1", "text": "“一个审核难度比较低的游戏平台先开发要上的游戏”\n\n这个不一定呀，你自己让 AI 开发游戏，得到游戏代码，部署到 Cloudflare 去就好了"}, {"index": 23, "sender": "。", "time": "2026-08-18 21:13", "type": "1", "text": "或者不一定要是游戏平台，我自己做一个游戏的管理系统也可以？[脸红]专门存放游戏。然后游戏站负责SEO +  iframe url链接游戏。这样是不是也可以？那么我自己做的这个游戏管理系统是否要提交GSC收录呢？应该不用吧。我不确定爬虫会不会怕游戏的内容。"}, {"index": 24, "sender": "哥飞", "time": "2026-08-18 21:13", "type": "1", "text": "准确的说，是部署到 R2 去"}, {"index": 25, "sender": "。", "time": "2026-08-18 21:13", "type": "1", "text": "R2是什么。。这个概念我不太懂。"}, {"index": 26, "sender": "源", "time": "2026-08-18 21:14", "type": "1", "text": "存储桶"}, {"index": 27, "sender": "哥飞", "time": "2026-08-18 21:14", "type": "1", "text": "“我自己做的这个游戏管理系统是否要提交GSC收录呢？”\n\n你上站的目的是什么？\n难道不是搞到流量吗？"}, {"index": 28, "sender": "源", "time": "2026-08-18 21:15", "type": "2", "text": "图片", "unavailable": "原记录包含图片，本机未找到这张转发图片的文件。"}, {"index": 29, "sender": "。", "time": "2026-08-18 21:15", "type": "1", "text": "感谢。"}, {"index": 30, "sender": "哥飞", "time": "2026-08-18 21:15", "type": "1", "text": "Cloudflare R2 里边可以放任何静态文件，自然也包括 html 文件和js 文件和css 文件。\n你的游戏前端代码，都可以放到 R2 去，只收存储费用，不收请求费用。\n这样你的游戏被 100 人玩和被 10000 人玩，费用是一样的。"}, {"index": 31, "sender": "哥飞", "time": "2026-08-18 21:16", "type": "1", "text": "如果你存储到别的会按照请求收费的地方去，那么玩的人越多，你需要支付的钱也越多。"}, {"index": 32, "sender": "哥飞", "time": "2026-08-18 21:16", "type": "1", "text": "如果部署到你自己的服务器去，又会受限于服务器的带宽，无法满足很多人同时玩。"}]}, "links": [{"url": "https://new.web.cafe/search-simulator/", "status": "unavailable"}]}, {"pos": 243, "create_time": 1787059141, "kind": "text", "sender": "siuser小伟", "body": "再次给大家详细讲讲前端渲染和后端渲染的区别，同时说明游戏站的套路玩法。", "detail": "", "links": []}, {"pos": 244, "create_time": 1787116417, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "thumbnail", "src": "assets/3a1c1a11fcb87a4fd7db57d4.webp", "width": 180, "height": 102, "ocr": "3m\ncy new reset button today\n精美的全新重置按钮作为礼", "alt": "群聊图片，图片文字开头：3mcy new reset button today精美的全新重置按钮作为礼"}, "links": []}, {"pos": 24 仔细思考，"}, {"index": 11, "sender": "低调哥", "time": "2026-08-22 12:34:05", "type": "1", "text": "所以一个Ip的底层逻辑，一定不是这个人的观点，"}, {"index": 12, "sender": "低调哥", "time": "2026-08-22 12:34:16", "type": "1", "text": "是这个人，有了成就，你才认同他的观点，"}, {"index": 13, "sender": "低调哥", "time": "2026-08-22 12:34:48", "type": "1", "text": "这一句话，你没懂你怎么做Ip你都赚不到钱，"}, {"index": 14, "sender": "低调哥", "time": "2026-08-22 12:36:21", "type": "1", "text": "你会发现很多时候很多人ip做的就是本末倒置的"}, {"index": 15, "sender": "低调哥", "time": "2026-08-22 12:38:32", "type": "1", "text": "我这么多年的观察，IP成功只有两条路，"}, {"index": 16, "sender": "低调哥", "time": "2026-08-22 12:38:52", "type": "1", "text": "一条路就是强人设，你首先就是一个很厉害的人，这种人，就值得让人追随，"}, {"index": 17, "sender": "低调哥", "time": "2026-08-22 12:39:14", "type": "1", "text": "另外一种留给普通人的路，就是成长型Ip"}, {"index": 18, "sender": "低调哥", "time": "2026-08-22 12:39:25", "type": "1", "text": "这个成长也必须足够迅速，你做出来成就，"}, {"index": 19, "sender": "低调哥", "time": "2026-08-22 12:39:38", "type": "1", "text": "记住，没有成就，没有实力的，很难成为大Ip"}, {"index": 20, "sender": "低调哥", "time": "2026-08-22 12:39:51", "type": "1", "text": "你会听菜市场大妈给你讲的股市分析吗，"}, {"index": 21, "sender": "低调哥", "time": "2026-08-22 12:40:00", "type": "1", "text": "你会听卖葱大爷给你讲如何创业吗，"}, {"index": 22, "sender": "低调哥", "time": "2026-08-22 12:40:15", "type": "1", "text": "成长就是从不可能变成可能，让别人见证你的挑战过程，"}, {"index": 23, "sender": "低调哥", "time": "2026-08-22 12:40:36", "type": "1", "text": "强人设，就是你真的有实力，哪怕有些是包装的"}, {"index": 24, "sender": "低调哥", "time": "2026-08-22 12:40:45", "type": "1", "text": "除了这两条路，别的路，基本没有。"}, {"index": 25, "sender": "低调哥", "time": "2026-08-22 12:41:02", "type": "1", "text": "所以很多人一直口播，一直写文章，忽视了一个很重要的点，"}, {"index": 26, "sender": "低调哥", "time": "2026-08-22 12:41:09", "type": "1", "text": "用户凭什么听你说，"}, {"index": 27, "sender": "低调哥", "time": "2026-08-22 12:41:14", "type": "1", "text": "用户凭什么相信你，"}, {"index": 28, "sender": "低调哥", "time": "2026-08-22 12:41:54", "type": "1", "text": "这个问题，你不解决，你Ip根本就做不起来，也赚不到钱"}, {"index": 29, "sender": "低调哥", "time": "2026-08-22 12:42:33", "type": "1", "text": "所以你看我现在，就是踏踏实实积累，我也没有去怎么对外输出了，你输了，你就踏踏实实打磨内功，做出成就，大家才会重新成为你的追随者，"}, {"index": 30, "sender": "低调哥", "time": "2026-08-22 12:42:55", "type": "1", "text": "很多时候，很多人特别希望观众和你亲人一样，花费大量时间了解你的内在，"}, {"index": 31, "sender": "低调哥", "time": "2026-08-22 12:43:10", "type": "1", "text": "出来卖，要么皮囊好，要么有意思，"}, {"index": 32, "sender": "低调哥", "time": "2026-08-22 12:43:34", "type": "1", "text": "皮囊好：强人设\n有意思：有噱头，"}, {"index": 33, "sender": "低调哥", "time": "2026-08-22 12:43:42", "type": "1", "text": "IP也一定是稀缺的，"}, {"index": 34, "sender": "低调哥", "time": "2026-08-22 12:43:48", "type": "1", "text": "不是一个培训班就可以教出来的"}, {"index": 35, "sender": "低调哥", "time": "2026-08-22 12:44:04", "type": "1", "text": "因为Ip的底层内核是你的优势，你的过去，"}, {"index": 36, "sender": "低调哥", "time": "2026-08-22 12:44:23", "type": "1", "text": "没有强人设，你很难支撑起来一个大Ip"}, {"index": 37, "sender": "低调哥", "time": "2026-08-22 12:44:35", "type": "1", "text": "这个世界就是这么现实，"}, {"index": 38, "sender": "低调哥", "time": "2026-08-22 12:44:56", "type": "1", "text": "没有那么多时间去了解你，哪怕你的观点很正确，很厉害，"}, {"index": 39, "sender": "低调哥", "time": "2026-08-22 12:45:18", "type": "1", "text": "这就是现实，通过一个Ip的形象，你也可以看透他的人群，"}, {"index": 40, "sender": "低调哥", "time": "2026-08-22 12:45:27", "type": "1", "text": "他的形象，吸引的也是类似的人群，"}, {"index": 41, "sender": "低调哥", "time": "2026-08-22 12:45:45", "type": "1", "text": "这个世界就是这样，因为IP也是一种品味，"}, {"index": 42, "sender": "低调哥", "time": "2026-08-22 12:46:03", "type": "1", "text": "今天就讲这么多，你不理解你就不理解了，你理解了你就理解了，"}, {"index": 43, "sender": "低调哥", "time": "2026-08-22 12:46:13", "type": "1", "text": "别去做盲目的傻努力，一点价值都没有。"}, {"index": 44, "sender": "低调哥", "time": "2026-08-22 12:46:32", "type": "1", "text": "抄两篇稿子，讲两条口播，成不了Ip。"}]}, "links": []}, {"pos": 265, "create_time": 1787391646, "kind": "text", "sender": "siuser小伟", "body": "deepseek无限制版", "detail": "", "links": []}, {"pos": 266, "create_time": 1787391646, "kind": "text", "sender": "siuser小伟", "body": "https://unlimitds.chat/", "detail": "", "lin 薅会员就先薅会员，有实力的再顺手把奖金也薅了。先到先得，抓紧！", "detail": "", "links": [{"url": "http://51tokenlink.com/login?ref=remio", "status": "unavailable"}, {"url": "https://51tokenlink.com/tracks", "status": "read", "title": "大赛介绍 | 金漪湖论剑"}]}, {"pos": 299, "create_time": 1787830088, "kind": "forward_chat", "sender": "siuser小伟", "body": "转发的聊天记录", "detail": "", "forward": {"title": "群聊的聊天记录", "items": [{"index": 0, "sender": "Shadow", "time": "2026-08-27 18:58", "type": "1", "text": "我们为 20 万 Star 的 DeepSeek Harness 写了一本开源书，不仅教你如何在实战中使用，还讲他如何能开启自我进化。\n\n市面上的教程里 90% 都是 AI 的粗糙产物，而我们 7 名同学花费了 14 天时间，编写了近 200 页的《DeepSeek Harness 实战指南》，力求写出一本全面、高质量的 DeepSeek Harness 教程。\n\n如果你想在生活工作中运用 DeepSeek Harness，我们提供了 8 类办公场景的教程+源码，从短剧制作到一人公司，教你怎么用它真正提效。\n\n如果你想深入理解 DeepSeek Harness，本书会讲清它的结构和原理，讲透核心插件系统 Cordis，并用实战案例教你开启 Agent 自进化。\n\n目前，书稿已经在 GitHub 免费开源，在线阅读网站也已上线。\n\n欢迎来阅读、点 Star 收藏这本实战手册。\n\n在线阅读：https://dshbook.penguin.ooo/\n\nGitHub：https://github.com/Prism-Shadow/deepseek-harness-book"}, {"index": 1, "sender": "Shadow", "time": "2026-08-27 18:58", "type": "8", "text": "DeepSeek Harness 实战指南.pdf", "unavailable": "原记录包含附件，本机未找到可公开打开的附件文件。"}]}, "links": [{"url": "https://dshbook.penguin.ooo/", "status": "unavailable"}, {"url": "https://github.com/Prism-Shadow/deepseek-harness-book", "status": "unavailable"}]}, {"pos": 300, "create_time": 1787968766, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "full", "src": "assets/2a4186aef7341ac54ffc8e56.webp", "width": 1080, "height": 1964, "ocr": "Tibo 夕\n@thsottiaux •2分\n◎ 翻译自英语 显示原文\n我们不幸决定，我们无法继续通过 Cursor 提供\n对我们模型的访问，并将终止我们的合作伙伴\n关系。这归结于信任问题，我们已要求此决定\n于11月12日生效，以给您一些时间进行规划。\n许多人通过 Cursor 使用了 GPT模型，以下是\n我们知道未来应该可行的选项：\n-我们将继续允许使用您自己的 OpenAI API 密\n钥，同样，我们将继续通过我们的IDE扩展为\nCursor 提供访问权限。\n-我们将继续与最广泛的工具和框架合作，其中\n一些是开源的，但也有许多许多闭源的。\n我们一如既往地致力于继续支持开发者和蓬勃\n发展的工具、框架和产品生态系统。我们还将\n继续投资于我们自己的开源项目，并相信为开\n发者提供广泛的选择性。\n您可以在博客中阅读有关我们决定的更多信\n息：\nopenai.com/index/our-deci..\n⑤ OpenAI\n@OpenAI•3分\n⑦ 翻译自英语\n我们将终止与 Cursor 的合作关系，该公司已\n被SpaceX 收购。根据我们的提议，Cursor\n对我们模型的直接访问将于11月12日结束。\n我们知道，受此决定影响最大的人群是那些.\n⑦ 36\n① 26\n3162 小l万万口品", "alt": "群聊图片，图片文字开头：Tibo 夕@thsottiaux •2分◎ 翻译自英语 显示原文我们不幸决定，我们无法继续通过 Cursor 提供对我们模型的访问，并将终止我们的合作伙伴关系。这归结于信任问题，我们已要求此决定于11月12日生效，以给您一些时间进行规划。许多人通过 Cursor 使用了 GPT"}, "links": []}, {"pos": 301, "create_time": 1787975095, "kind": "link", "sender": "siuser小伟", "body": "前线部署工程师（FDE）开源版全书精华", "detail": "David的AI全景图", "links": [{"url": "https://www.xiaoyuzhoufm.com/episode/6a918404f03e74ee6b0157d1?s=eyJ1IjogIjYyMzlkMDhkZWRjZTY3MTA0YWY0YWIzYiJ9", "status": "read", "title": "前线部署工程师（FDE）开源版全书精华"}]}, {"pos": 302, "create_time": 1787975098, "kind": "file", "sender": "siuser小伟", "body": "前线部署工程师.pdf", "detail": "", "links": []}, {"pos": 303, "create_time": 1787976453, "kind": "link", "sender": "siuser小伟", "body": "Warp 如何让 Agent 自我进化", "detail": "Warp 用人类反馈持续改进 Skill，为 Agent 建立了一套低摩擦的自我进化循环。", "links": [{"url": "https://mp.weixin.qq.com/s/1YaHaOC1veK3dJhlJyvE9Q", "status": "unavailable"}]}, {"pos": 304, "create_time": 1787976453, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "full", "src": "assets/374695461d4b98e873974bb4.webp", "width": 1024, "height": 1854, "ocr": "\u003cp\u003e一支烟花AI社区\u003c/p\u003e\nWarp 如何让 Agent 自我进化\n内容摘要\n本文介绍了 Warp 公司如何利用 Claude 构建自我改进的 Agent 系\n统，核心是通过两个 Skill（代码审查 Skill 和改进 Skill 结合人类\n反馈，让 Agent 自动从工程师的评论中学习并优化技能。文章总结\n了六条最佳实践，并探讨了反馈错误时的应对策略。\nP 关键要点\n① 问题背景：Agent 缺乏记忆，不了解项目、团队规范和历史经\n验，导致 Code Review 效果不佳。\n② 解决方案：使用两个 Skill——基础Skill 负责代码审查，改进\nSkill 定期收集人类工程师的评论并更新审查 Skill。\n③ 低摩擦反馈：人们自然评论 PR 或 issue，Agent 自动收集和利\n用，无需额外提交步骤。\n④ 最佳实践1：写原则而非死规则，引导 Agent 推理。\n⑤ 最佳实践2：解释规则背后的原因，帮助 Agent 举一反三。\n6 最佳实践3：保持 Skill 精简，使用渐进式披露，引用资源而非塞\n入全部内容。\n⑦ 最佳实践4：反馈质量优先于数量，但足够的高质量信号越多越\n好。\n⑧ 最佳实践5：改进 Skill 具有通用性，可复用于其他 Skill的改\n进。\n⑨应对错误反馈：不盲目接受反馈，通过上下文检查、权限限制和\n人类审核来确保质量。\n智能标签#自我改进 Agent #Skill 进化＃人类反馈\n0 预计阅读：3分钟 字数：3288", "alt": "群聊图片，图片文字开头：\u003cp\u003e一支烟花AI社区\u003c/p\u003eWarp 如何让 Agent 自我进化内容摘要本文介绍了 Warp 公司如何利用 Claude 构建自我改进的 Agent 系统，核心是通过两个 Skill（代码审查 Skill 和改进 Skill 结合人类反馈，让 Agent 自动从工程师的评论中"}, "links": []}, {"pos": 309, "create_time": 1787983203, "kind": "sticker", "sender": "siuser小伟", "body": "消息内容", "detail": "", "links": []}, {"pos": 312, "create_time": 1787983285, "kind": "text", "sender": "siuser小伟", "body": "不清楚 没咋看谷歌了[破涕为笑]", "detail": "", "links": []}, {"pos": 313, "create_time": 1787984145, "kind": "text", "sender": "siuser小伟", "body": "可能又要重置了", "detail": "", "links": []}, {"pos": 314, "create_time": 1787984146, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "full", "src": "assets/1829187873e9c4176eb92df9.webp", "width": 599, "height": 210, "ocr": "Tibo v\n@thsottiaux\n◎⋯\n◎ 翻译自 英语 显示原文 ◎\n查看仪表板，我们明天可能会达到一个新的里程碑来庆祝。抓住你的 Codex\n评价此翻译：凸⑦\n下午1:38 2026年8月29日 8.2万 查看", "alt": "群聊图片，图片文字开头：Tibo v@thsottiaux◎⋯◎ 翻译自 英语 显示原文 ◎查看仪表板，我们明天可能会达到一个新的里程碑来庆祝。抓住你的 Codex评价此翻译：凸⑦下午1:38 2026年8月29日 8.2万 查看"}, "links": []}, {"pos": 315, "create_time": 1787991971, "kind": "file", "sender": "siuser小伟", "body": "AI赋能短视频快闪课.pdf", "detail": "", "links": []}, {"pos": 316, "create_time": 1788081621, "kind": "text", "sender": "siuser小伟", "body": "Zed 现在开放学生认证，大学生可免费获得 1 年 Pro。\n\n有人已实测，中国大学的校园邮箱也支持认证。\n\n平时写代码、用 AI 辅助开发的学生可以去试试\n\nhttps://dashboard.zed.dev/education/apply", "detail": "", "links": [{"url": "https://dashboard.zed.dev/education/apply", "status": "read", "title": "Build software better, together"}]}, {"pos": 317, "create_time": 1788081622, "kind": "image", "sender": "siuser小伟", "body": "图片", "detail": "", "media": {"kind": "image", "quality": "thumbnail", "src": "assets/79259b6a9140879d094d4620.webp", "width": 90, "height": 180, "ocr": "", "alt": "群聊图片，没有识别出可读文字", "ocr_checked": true}, "links": []}, {"pos": 318, "create_time": 1788095017, "kind": "text", "sender": "siuser小伟", "body": "有做X的朋友们，可以来听听\nStanley和他的朋友们：15天万粉，1周3篇百万长文！他是怎么做到的？运营心得全分析！欢迎上麦！https://x.com/i/spaces/1dKrPrmAlwXJX?s=20", "d function apply(clearHash=true){$('filter-label').textContent=($('start').value||$('end').value||$('match').value==='exact')?'日期与搜索选项 · 已启用':'日期与搜索选项';terms=norm($('q').value).match(/[a-z0-9]+|[\p{Script=Han}]+|[^\s\p{P}\p{S}]+/gu)||[];const start=$('start').value?Date.parse($('start').value+'T00:00:00+08:00')/1000:-Infinity,end=$('end').value?Date.parse($('end').value+'T23:59:59+08:00')/1000:Infinity;nearMatches=new Set();filtered=search.filter(({m})=>m.create_time>=start&&m.create_time<=end&&(kind==='all'||kind==='image'&&m.kind==='image'||kind==='link'&&m.links.length||kind==='video'&&['video','channel_video'].includes(m.kind))).map(entry=>({m:entry.m,score:score(entry)})).filter(e=>e.score>0).sort((a,b)=>(terms.length?b.score-a.score:0)||($('sort').value==='asc'?1:-1)*(a.m.create_time-b.m.create_time||a.m.pos-b.m.pos)).map(e=>{if(e.score<terms.length*10)nearMatches.add(e.m.pos);return e.m;});page=1;syncUrl(clearHash);renderRoute();}

for(const [id,delta] of [['prev',-1],['next',1]])$(id).addEventListener('click',()=>{page+=delta;syncUrl();renderList();$('count').scrollIntoView({block:'start'});$('count').tabIndex=-1;$('count').focus({preventScroll:true});});window.addEventListener('hashchange',()=>renderRoute(true));window.addEventListener('popstate',()=>renderRoute(true));
let activeMedia=null,imageScale=1,imageReturn=null;
function scaleImage(value){imageScale=Math.min(8,Math.max(.05,value));$('viewer-image').style.width=Math.round(activeMedia.width*imageScale)+'px';$('viewer-image').style.height=Math.round(activeMedia.height*imageScale)+'px';$('zoom-status').textContent=Math.round(imageScale*100)+'% · '+activeMedia.width+' × '+activeMedia.height;}
function fitImage(){scaleImage(Math.min(1,($('image-canvas').clientWidth-32)/activeMedia.width));}
function openImage(media,button){activeMedia=media;imageReturn=button;$('viewer-image').src=media.src;$('viewer-image').alt=media.alt;$('image-original').href=media.src;$('image-quality').textContent=media.quality==='thumbnail'?'这张图只有 '+media.width+' × '+media.height+' 的缩略图，本机未找到更清晰版本。放大不会增加细节。':'可用图片尺寸：'+media.width+' × '+media.height+'。可按原尺寸查看，或缩放后滚动阅读。';$('image-viewer').showModal();fitImage();$('image-canvas').scrollTo(0,0);}
$('zoom-in').addEventListener('click',()=>scaleImage(imageScale*1.5));$('zoom-out').addEventListener('click',()=>scaleImage(imageScale/1.5));$('zoom-original').addEventListener('click',()=>scaleImage(1));$('zoom-fit').addEventListener('click',fitImage);$('image-close').addEventListener('click',()=>$('image-viewer').close());$('image-viewer').addEventListener('close',()=>imageReturn?.focus());
document.querySelectorAll('[data-count]').forEach(el=>{const k=el.dataset.count;el.textContent=data.messages.filter(m=>k==='all'||k==='image'&&m.kind==='image'||k==='link'&&m.links.length||k==='video'&&['video','channel_video'].includes(m.kind)).length;});
const params=new URLSearchParams(location.search);$('q').value=params.get('q')||'';$('start').value=params.get('start')||'';$('end').value=params.get('end')||'';$('sort').value=params.get('sort')==='asc'?'asc':'desc';$('match').value=params.get('match')==='exact'?'exact':'fuzzy';kind=['image','link','video'].includes(params.get('type'))?params.get('type'):'all';document.querySelectorAll('[data-kind]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.kind===kind)));const requestedPage=Math.max(1,Number(params.get('page'))||1);apply(false);page=requestedPage;syncUrl();renderRoute(Boolean(location.hash));

if($('start').value||$('end').value||$('match').value==='exact')$('advanced-filters').open=true;

</script>
</body></html>
